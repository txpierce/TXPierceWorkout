<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chase the Lion: Ultimate Lift Program</title>
    <!-- Tailwind CSS CDN -->
    <script src="[suspicious link removed]"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .card { background-color: #1e293b; border: 1px solid #334155; }
        .input-dark { background-color: #0f172a; border: 1px solid #475569; color: #f8fafc; }
    </style>
</head>
<body class="pb-12">
    <div class="max-w-md mx-auto p-4 space-y-6">
        <!-- HEADER -->
        <header class="text-center py-4 border-b border-slate-700">
            <h1 class="text-2xl font-black tracking-tight text-red-500 flex items-center justify-center gap-2">
                <span>🦁</span> CHASE THE LION
            </h1>
            <p class="text-xs text-slate-400 mt-1">Ultimate 12-Week Lift Program & Protocol Hub</p>
        </header>

        <!-- NAVIGATION DROPDOWNS -->
        <section class="card p-4 rounded-xl space-y-3 shadow-lg">
            <div>
                <label class="block text-xs font-bold text-red-400 uppercase tracking-wider mb-1">Phase</label>
                <select id="phaseSelect" onchange="onPhaseChange()" class="w-full input-dark rounded-lg p-2.5 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-red-500"></select>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Week</label>
                <select id="weekSelect" onchange="onWeekChange()" class="w-full input-dark rounded-lg p-2.5 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-red-500"></select>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Day</label>
                <select id="daySelect" onchange="renderWorkout()" class="w-full input-dark rounded-lg p-2.5 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-red-500"></select>
            </div>
        </section>

        <!-- DAILY NUTRITION TARGETS CARD -->
        <section class="card p-4 rounded-xl border-l-4 border-amber-500">
            <h2 class="text-sm font-bold text-amber-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                ⚡ Early Morning Nutrition & Fueling
            </h2>
            <div id="nutritionBox" class="text-xs text-slate-300 space-y-1"></div>
        </section>

        <!-- WORKOUT EXERCISES SECTION -->
        <section class="space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-base font-bold text-slate-200">Daily Exercise Hierarchy</h2>
                <button onclick="resetLogs()" class="text-xs text-slate-400 hover:text-red-400 underline">Reset Day Checks</button>
            </div>
            <div id="exerciseList" class="space-y-3"></div>
        </section>

        <!-- PEPTIDE RECONSTITUTION CALCULATOR -->
        <section class="card p-4 rounded-xl space-y-3 border-l-4 border-blue-500">
            <h2 class="text-sm font-bold text-blue-400 uppercase tracking-wider flex items-center gap-2">
                🧪 Peptide Reconstitution Calculator
            </h2>
            <div class="grid grid-cols-2 gap-3 text-xs">
                <div>
                    <label class="block text-slate-400 mb-1">Vial Quantity (mg)</label>
                    <input type="number" id="vialMg" value="5" step="0.5" oninput="calcPeptide()" class="w-full input-dark rounded p-2 text-sm">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">BAC Water (mL)</label>
                    <input type="number" id="bacMl" value="2" step="0.5" oninput="calcPeptide()" class="w-full input-dark rounded p-2 text-sm">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Target Dose (mcg)</label>
                    <input type="number" id="targetMcg" value="250" step="50" oninput="calcPeptide()" class="w-full input-dark rounded p-2 text-sm">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Syringe Size</label>
                    <select id="syringeUnits" onchange="calcPeptide()" class="w-full input-dark rounded p-2 text-sm">
                        <option value="100">U-100 (1.0 mL)</option>
                        <option value="50">U-50 (0.5 mL)</option>
                        <option value="30">U-30 (0.3 mL)</option>
                    </select>
                </div>
            </div>
            <div id="peptideResult" class="bg-slate-900 p-3 rounded-lg text-center font-mono text-sm border border-slate-700 text-blue-300"></div>
        </section>

        <!-- DATA MANAGEMENT -->
        <section class="card p-4 rounded-xl text-center space-y-3">
            <h3 class="text-xs font-bold text-slate-400 uppercase">Workout History & Export</h3>
            <button onclick="exportCSV()" class="w-full bg-red-600 hover:bg-red-700 text-white text-xs font-bold py-2.5 px-4 rounded-lg shadow">
                📥 Export Workout CSV
            </button>
        </section>
    </div>
</body>
</html>
